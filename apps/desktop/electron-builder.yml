# electron-builder config for Producer Studio desktop (Windows NSIS first).
# Build with: npm run dist -w @producer/desktop   (runs web build → main/preload build → stage → tools → builder)
# scripts/dist.mjs runs electron-builder through its API and lays scripts/release.mjs's releaseConfig() over this file:
# the Electron fuses (D-12) live there, so a plain `electron-builder` run would build without them.
appId: studio.producer.desktop
productName: Producer Studio
copyright: Copyright © 2026 Producer Studio
directories:
  output: release
  buildResources: build/resources
# app.asar holds only the Electron main process, preload and splash; the server, web UI and tools live in
# resources/ (unpacked) so their binaries (ffmpeg, onnxruntime, whisper, chrome) can be executed.
files:
  - dist/**/*
  - package.json
  # window/taskbar icon loaded at runtime by main.ts
  - assets/icon.ico
  - assets/icon.png
  - "!**/*.map"
extraResources:
  - from: build/stage/server
    to: server
  # electron-builder skips node_modules folders inside extraResources unless they are named explicitly
  - from: build/stage/server/node_modules
    to: server/node_modules
    filter: ["**/*"]
  - from: build/stage/web
    to: web
  - from: build/stage/tools
    to: tools
asar: true
# app icon (apps/desktop/assets, generated by scripts/brand-icons.mjs; stage.mjs refreshes build/resources from it)
icon: assets/icon.png
# electron is hoisted to the repo root node_modules; keep in sync with devDependencies
electronVersion: 44.4.5
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
  # Code signing: unsigned unless the environment says how (docs/desktop.md, "Code signing"). scripts/release.mjs adds
  # `azureSignOptions` when the AZURE_TRUSTED_SIGNING_* account and AZURE_TENANT_ID / AZURE_CLIENT_ID /
  # AZURE_CLIENT_SECRET are set; a .pfx in CSC_LINK + CSC_KEY_PASSWORD (or WIN_CSC_*) is electron-builder's own.
  signtoolOptions:
    publisherName: Producer Studio
    signingHashAlgorithms: [sha256]
  forceCodeSigning: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Producer Studio
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  artifactName: Producer-Studio-Setup-${version}.exe
  deleteAppDataOnUninstall: false
