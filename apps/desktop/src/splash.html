<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Producer Studio</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0e14;
        color: #f3f5fa;
        font: 14px/1.4 'Segoe UI', system-ui, sans-serif;
        -webkit-app-region: drag;
        user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .mark {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        background: linear-gradient(135deg, #ff5a5f, #7c5cff 60%, #35e0ff);
        box-shadow: 0 10px 30px rgba(124, 92, 255, 0.35);
      }
      h1 {
        margin: 0;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0;
        color: #9aa3b5;
        font-size: 12.5px;
      }
      .bar {
        width: 160px;
        height: 3px;
        border-radius: 3px;
        background: #1c2130;
        overflow: hidden;
      }
      .bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #7c5cff;
        border-radius: 3px;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark"></div>
      <h1>Producer Studio</h1>
      <div class="bar"><i></i></div>
      <p>Starting the local engine…</p>
    </div>
  </body>
</html>
